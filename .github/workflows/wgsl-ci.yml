# CI for the wgsl branch. This replicates upstream's CI (.github/workflows/main.yml), which only runs on
# pushes to main and on pull requests, and additionally validates the generated WGSL with Tint.
#
# The ctest suite includes the WGSL regression tests (shaders-wgsl). test_shaders.py validates each
# generated WGSL file with tint when it's found in PATH, so on ubuntu-24.04 a pinned Tint build from
# Dawn's releases is installed first. WGSL output does not depend on the platform, so validating it on
# one platform is enough.
#
# Unlike upstream's CI, the builds are not uploaded as artifacts. Binaries are only produced for macOS and
# Windows, by the Release workflow.
#
# Upstream's main.yml is kept unmodified to avoid merge conflicts. It can be disabled in this
# repository's Actions settings, since this workflow covers it.

name: WGSL CI

on:
  push:
    branches: [ wgsl ]
  pull_request:
    branches: [ wgsl ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Dawn release providing the tint binary used to validate WGSL output.
  DAWN_RELEASE: v20261002.154047

jobs:
  build:
    name: "Build ${{ matrix.platform }}"
    strategy:
      matrix:
        platform: [windows-latest, ubuntu-24.04, ubuntu-22.04, macos-15]
    env:
      PARALLEL: -j 2

    runs-on: "${{ matrix.platform }}"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache glslang / SPIRV-Tools
        id: cache-externals
        uses: actions/cache@v6
        with:
          path: external/*-build/output
          key: ${{ matrix.platform }} externals ${{ hashFiles('checkout_glslang_spirv_tools.sh', 'build_glslang_spirv_tools.sh') }}

      - name: Pull glslang / SPIRV-Tools
        if: steps.cache-externals.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{github.workspace}}
        run: ./checkout_glslang_spirv_tools.sh

      - name: Build glslang / SPIRV-Tools
        if: steps.cache-externals.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{github.workspace}}
        run: ./build_glslang_spirv_tools.sh Release 4

      - name: Install Tint
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DAWN_RELEASE" --repo google/dawn --pattern "Dawn-*-ubuntu-latest-Release.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/Dawn-*-ubuntu-latest-Release.tar.gz -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/tint"
          cp "$RUNNER_TEMP"/Dawn-*-ubuntu-latest-Release/bin/tint "$RUNNER_TEMP/tint/"
          # Make sure tint works, since test_shaders.py silently skips validation when it's not found.
          # (tint --help exits with an error, so validate a trivial shader instead.)
          echo '@compute @workgroup_size(1) fn main() {}' > "$RUNNER_TEMP/smoke.wgsl"
          "$RUNNER_TEMP/tint/tint" --format wgsl -o /dev/null "$RUNNER_TEMP/smoke.wgsl"
          echo "$RUNNER_TEMP/tint" >> "$GITHUB_PATH"

      - name: Configure SPIRV-Cross
        shell: bash
        run: |
          mkdir build
          cd build
          cmake .. -DSPIRV_CROSS_WERROR=ON -DSPIRV_CROSS_MISC_WARNINGS=ON -DSPIRV_CROSS_SHARED=ON -DCMAKE_INSTALL_PREFIX=output -DCMAKE_BUILD_TYPE=Release -DSPIRV_CROSS_ENABLE_TESTS=ON -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build SPIRV-Cross
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          cmake --build . --config Release --parallel 4
          cmake --build . --config Release --target install

      - name: Test SPIRV-Cross
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: ctest --verbose -C Release

  build-mobile:
    # iOS is 10x expensive to run on GitHub machines, so only run if we know something else passed as well
    needs: build
    name: "Build ${{ matrix.sdk }}"
    strategy:
      matrix:
        include:
          - platform: iOS
            sdk: iphoneos
            architectures: arm64
          - platform: iOS
            sdk: iphonesimulator
            architectures: x86_64;arm64
          - platform: tvOS
            sdk: appletvos
            architectures: arm64
          - platform: tvOS
            sdk: appletvsimulator
            architectures: x86_64;arm64
    env:
      PARALLEL: -j 2

    runs-on: "macos-15"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache glslang / SPIRV-Tools
        id: cache-externals
        uses: actions/cache@v6
        with:
          path: external/*-build/output
          key: ${{ matrix.platform }} externals ${{ hashFiles('checkout_glslang_spirv_tools.sh', 'build_glslang_spirv_tools.sh') }}

      - name: Pull glslang / SPIRV-Tools
        if: steps.cache-externals.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{github.workspace}}
        run: ./checkout_glslang_spirv_tools.sh

      - name: Build glslang / SPIRV-Tools
        if: steps.cache-externals.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{github.workspace}}
        run: ./build_glslang_spirv_tools.sh Release 4

      - name: Configure SPIRV-Cross
        shell: bash
        run: |
          mkdir build
          cd build
          cmake .. -DSPIRV_CROSS_WERROR=ON -DSPIRV_CROSS_MISC_WARNINGS=ON -DSPIRV_CROSS_SHARED=ON -DCMAKE_INSTALL_PREFIX=output -DCMAKE_BUILD_TYPE=Release -DSPIRV_CROSS_ENABLE_TESTS=ON -DCMAKE_SYSTEM_NAME=${{ matrix.platform }} -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architectures }}" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_SYSROOT=`xcodebuild -version -sdk ${{ matrix.sdk }} Path` -DBUILD_SHARED_LIBS=OFF

      - name: Build SPIRV-Cross
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          cmake --build . --config Release --parallel 4
          cmake --build . --config Release --target install


  reuse:
    name: "REUSE license check"
    runs-on: ubuntu-latest
    container: khronosgroup/docker-images:asciidoctor-spec

    steps:
      - uses: actions/checkout@v7

      # REUSE license checker
      - name: license-check
        run: |
          reuse lint
